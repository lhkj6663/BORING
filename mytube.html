<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 【可修改】浏览器标签页标题 -->
    <title>Mytube</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #181818;
            color: #ffffff;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            display: flex;
            min-height: 100vh;
        }

        /* ===== 侧边栏 ===== */
        .sidebar {
            width: 220px;
            background-color: #212121;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 56px;
            left: 0;
            bottom: 0;
            transition: width 0.3s;
            overflow: hidden;
            z-index: 10;
        }
        .sidebar.collapsed { width: 60px; }
        .sidebar-item {
            display: flex;
            align-items: center;
            padding: 12px 24px;
            cursor: pointer;
            color: #cccccc;
            font-size: 15px;
            white-space: nowrap;
        }
        .sidebar-item:hover { background-color: #383838; color: #fff; }
        .sidebar-item .icon { margin-right: 16px; font-size: 18px; width: 24px; text-align: center; }
        .sidebar.collapsed .sidebar-item span:not(.icon) { display: none; }
        .sidebar-toggle {
            padding: 8px 24px;
            cursor: pointer;
            color: #aaaaaa;
            margin-bottom: 10px;
            font-size: 16px;
        }

        /* ===== 主内容区 ===== */
        .main-content {
            margin-left: 220px;
            margin-top: 56px;
            padding: 24px;
            flex: 1;
            transition: margin-left 0.3s;
        }
        .sidebar.collapsed ~ .main-content { margin-left: 60px; }

        /* ===== 顶部导航栏 ===== */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 56px;
            background-color: #202020;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 20;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #ff4444;  /* 【可修改】Logo颜色，如 #ff4444 (红) / #00a1d6 (蓝) */
        }
        .search-box {
            display: flex;
            align-items: center;
        }
        .search-box input {
            width: 360px;
            padding: 8px 16px;
            border: 1px solid #303030;
            background-color: #121212;
            color: #fff;
            border-radius: 20px 0 0 20px;
            outline: none;
            font-size: 14px;
        }
        .search-box button {
            padding: 8px 20px;
            background-color: #313131;
            border: 1px solid #303030;
            color: #fff;
            border-radius: 0 20px 20px 0;
            cursor: pointer;
            font-size: 16px;
        }
        .user-avatar {
            width: 32px; height: 32px;
            background-color: #666;
            border-radius: 50%;
            cursor: pointer;
            /* 【可修改】替换为你的头像图片：url('images/avatar.jpg') */
            background-image: none;
            background-size: cover;
        }

        /* ===== 视频卡片网格 ===== */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .video-card {
            cursor: pointer;
            transition: transform 0.2s;
        }
        .video-card:hover { transform: translateY(-4px); }
        .thumbnail {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #333;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 10px;
        }
        .card-info {
            display: flex;
            gap: 10px;
        }
        .channel-icon {
            width: 36px; height: 36px;
            border-radius: 50%;
            background-color: #555;
            flex-shrink: 0;
            /* 【可修改】替换为频道小图标，也可直接用纯色 */
            background-size: cover;
        }
        .card-text h3 {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 6px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-text p {
            font-size: 13px;
            color: #aaaaaa;
            margin-bottom: 2px;
        }
        .like-btn {
            background: none;
            border: none;
            color: #aaaaaa;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 0;
            margin-top: 4px;
        }
        .like-btn:hover { color: #ff4444; }
        .like-btn.liked { color: #ff4444; }

        /* ===== 模态框（视频播放） ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            position: relative;
            width: 80%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
        }
        .modal-content iframe {
            width: 100%; height: 100%;
            border: none;
        }
        .close-modal {
            position: absolute;
            top: 10px; right: 20px;
            color: #fff;
            font-size: 32px;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- ========== 顶部导航 ========== -->
    <nav class="navbar">
        <div class="nav-left">
            <span class="sidebar-toggle" onclick="toggleSidebar()">☰</span>
            <!-- 【可修改】logo文字 -->
            <span class="logo">▶ Mytube</span>
        </div>
        <div class="search-box">
            <!-- 【互动】搜索框，实时过滤视频 -->
            <input type="text" id="searchInput" placeholder="搜索视频标题..." oninput="filterCards()">
            <button onclick="filterCards()">🔍</button>
        </div>
        <!-- 【可修改】右上角头像，替换图片路径 -->
        <div class="user-avatar" title="我的头像"></div>
    </nav>

    <!-- ========== 侧边栏 ========== -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-item"> <span class="icon">🏠</span> <span>首页</span> </div>
        <div class="sidebar-item"> <span class="icon">🔥</span> <span>热门</span> </div>
        <div class="sidebar-item"> <span class="icon">📁</span> <span>收藏</span> </div>
        <div class="sidebar-item"> <span class="icon">📺</span> <span>频道</span> </div>
    </div>

    <!-- ========== 主内容区：视频卡片列表 ========== -->
    <div class="main-content" id="mainContent">
        <div class="video-grid" id="videoGrid">
            <!-- 
                每个视频卡片结构：
                .video-card 包含 缩略图、频道图标、标题、观看次数、发布时间、点赞按钮
                通过 data-title 存放标题（用于搜索过滤），data-video 存放视频链接
                所有图片路径、文字都可以按编号修改
            -->
        </div>
    </div>

    <!-- ========== 视频播放模态框 ========== -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <iframe id="modalVideo" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // ===== 视频数据 =====
        // 数组中每个对象代表一个视频卡片。
        // 【⚠️ 重点修改区域】—— 在这里改你的视频信息
        const videos = [
            {
                id: 1,
                title: "【示例】日落时分的乌鲁木齐",
                thumbnail: "images/thumb1.jpg",   // 【可修改】缩略图路径，推荐16:9图片
                channelIcon: "images/channel1.jpg", // 【可修改】频道小头像，可留空
                channelName: "自由摄影师·李",
                views: "1.2万次观看",
                time: "3天前",
                videoUrl: "//player.bilibili.com/player.html?bvid=BV1GJ411x7h7&page=1", // 【可修改】替换为你的视频链接（支持YouTube/B站嵌入等）
                likes: 234
            },
            {
                id: 2,
                title: "【旅拍】南山牧场的星空延时",
                thumbnail: "images/thumb2.jpg",
                channelIcon: "images/channel2.jpg",
                channelName: "李的摄影日记",
                views: "8921次观看",
                time: "1周前",
                videoUrl: "//player.bilibili.com/player.html?bvid=BV1GJ411x7h7&page=1", // 同样可换
                likes: 156
            },
            {
                id: 3,
                title: "后期教程：Lightroom调出胶片色",
                thumbnail: "images/thumb3.jpg",
                channelIcon: "images/channel3.jpg",
                channelName: "后期自习室",
                views: "2.3万次观看",
                time: "2周前",
                videoUrl: "//player.bilibili.com/player.html?bvid=BV1GJ411x7h7&page=1",
                likes: 489
            },
            {
                id: 4,
                title: "街头摄影：乌鲁木齐大巴扎的清晨",
                thumbnail: "images/thumb4.jpg",
                channelIcon: "images/channel4.jpg",
                channelName: "街拍中国",
                views: "3.7万次观看",
                time: "1个月前",
                videoUrl: "//player.bilibili.com/player.html?bvid=BV1GJ411x7h7&page=1",
                likes: 520
            }
        ];

        // 存储每个卡片的点赞状态（可根据id扩展）
        let likeStatus = {};

        // ===== 渲染视频卡片 =====
        function renderCards(data) {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';
            data.forEach(v => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.setAttribute('data-title', v.title.toLowerCase());
                card.setAttribute('data-id', v.id);
                // 点击卡片打开视频（排除按钮点击冒泡）
                card.addEventListener('click', (e) => {
                    if (e.target.closest('.like-btn')) return; // 如果点到点赞按钮，不触发视频
                    openVideo(v.videoUrl, v.title);
                });

                const isLiked = likeStatus[v.id] || false;
                const likeClass = isLiked ? 'liked' : '';
                const heartIcon = isLiked ? '❤️' : '🤍';
                const currentLikes = isLiked ? v.likes + 1 : v.likes;

                card.innerHTML = `
                    <img class="thumbnail" src="${v.thumbnail}" alt="${v.title}" 
                         onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22320%22 height=%22180%22%3E%3Crect fill=%22%23444%22 width=%22320%22 height=%22180%22/%3E%3Ctext fill=%22%23aaa%22 x=%22160%22 y=%2290%22 text-anchor=%22middle%22 dy=%22.3em%22%3E图片加载失败%3C/text%3E%3C/svg%3E'">
                    <div class="card-info">
                        <div class="channel-icon" style="background-image: url('${v.channelIcon}'); background-color: #555;"></div>
                        <div class="card-text">
                            <h3>${v.title}</h3>
                            <p>${v.channelName}</p>
                            <p>${v.views} · ${v.time}</p>
                            <button class="like-btn ${likeClass}" data-id="${v.id}">
                                ${heartIcon} <span class="like-count">${currentLikes}</span>
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            // 为所有点赞按钮绑定事件
            document.querySelectorAll('.like-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const vid = parseInt(btn.dataset.id);
                    likeStatus[vid] = !likeStatus[vid];
                    // 重新渲染该卡片（简单方式重新渲染整个网格）
                    renderCards(data); 
                });
            });
        }

        // 初始渲染
        renderCards(videos);

        // ===== 搜索过滤 =====
        function filterCards() {
            const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = videos.filter(v => v.title.toLowerCase().includes(keyword));
            renderCards(filtered);
        }

        // ===== 侧边栏折叠 =====
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        // ===== 模态框控制 =====
        function openVideo(url, title) {
            document.getElementById('modalVideo').src = url;
            document.getElementById('videoModal').classList.add('active');
            document.title = title + ' - 播放中'; // 可选
        }
        function closeModal() {
            document.getElementById('videoModal').classList.remove('active');
            document.getElementById('modalVideo').src = ''; // 停止播放
            // 恢复原标题
            document.title = '我的视频空间';
        }
        // 点击模态框背景关闭
        document.getElementById('videoModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
