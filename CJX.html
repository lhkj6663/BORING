<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>这里改成你的文章标题</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 2;
            color: #333333;
            background-color: #ffffff;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 1em;
            text-align: center;
        }
        p {
            margin-bottom: 1.5em;
            font-size: 1.1em;
        }
        /* 这可以让手机上看也清楚 */
    </style>
</head>
<body>
    <h1>这里写你的文章主标题</h1>
    <p>这是文章的第一段。把你的500字内容分成多个段落，每个段落都用一对 &lt;p&gt; 和 &lt;/p&gt; 包起来。这个标签叫“段落标签”，浏览器看到它就知道这是一段文字。</p>
    
    <p>这是文章的第二段。继续写你的内容，注意文字里如果包含英文引号或特殊符号，一般不用管。如果文章里有小标题，可以用 &lt;h2&gt; 标签，但用不上就全用 &lt;p&gt;。</p>
    
    <p>这是第三段。你只放一篇文章，就这样一段一段写完即可。例如你可以写上500字的故事、说明、诗歌等。段落之间会自动空行，阅读很舒服。</p>
    
    <p>这是第四段。就这样一直写到完。最后一段结束后，不需要加任何东西。</p>
</body>
</html>
